<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvesO3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      color: #2a2a2a;
      background: #f0ede8;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #2a2a2a;
      color: #f0ede8;
    }

    .header-title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .connection-label {
      font-weight: bold;
    }

    .connection-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-connected .connection-label,
    .status-connected .connection-dot { color: #4caf50; background: #4caf50; }
    .status-offline .connection-label,
    .status-offline .connection-dot   { color: #e53935; background: #e53935; }
    .status-checking .connection-label,
    .status-checking .connection-dot  { color: #fb8c00; background: #fb8c00; }

    /* ── Section ── */
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #cbcbcb;
    }

    /* ── Switch row ── */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .switch-label {
      font-weight: bold;
      font-size: 14px;
    }

    .toggle-state-label {
    font-size: 12px;
    font-weight: bold;
    color: #757575;
    min-width: 24px;
    text-align: right;
    }

.toggle-state-label.on {
  color: #900;
}

    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 13px;
      background: #757575;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: #900;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      transition: transform 0.2s;
      pointer-events: none;
    }

    .toggle input:checked ~ .toggle-thumb {
      transform: translateX(22px);
    }

    .mode-message {
      font-size: 12px;
      color: #555;
      line-height: 1.5;
    }

    /* ── Saved / Recent ── */
    .list-section-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #900;
      margin-bottom: 6px;
    }

    .folder-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
    }

    .folder-entry .entry-icon {
      flex-shrink: 0;
      font-size: 14px;
    }

    .folder-entry .entry-path {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-entry .entry-remove {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #900;
      font-size: 14px;
      padding: 2px 4px;
      line-height: 1;
    }

    .empty-hint {
      font-size: 12px;
      color: #999;
      font-style: italic;
      padding: 4px 0;
    }

    /* ── Fetch button ── */
    .fetch-btn {
      width: 100%;
      padding: 9px;
      background: #2a2a2a;
      color: #f0ede8;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }

    .fetch-btn:hover { background: #444; }
    .fetch-btn:disabled { background: #aaa; cursor: default; }

    /* ── Breadcrumb ── */
    .breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #e4e0db;
      border-bottom: 1px solid #cbcbcb;
      min-height: 48px;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #2a2a2a;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .back-btn:disabled {
      color: #bbb;
      cursor: default;
    }

    .back-btn svg {
      width: 22px;
      height: 22px;
    }

    .breadcrumb-path {
      font-size: 13px;
      font-weight: bold;
      color: #2a2a2a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Folder list ── */
    .folder-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
    }

    .folder-item {
      display: flex;
      align-items: center;
      padding: 9px 16px;
      border-bottom: 1px solid #e8e4df;
      gap: 10px;
      cursor: pointer;
    }

    .folder-item:hover { background: #e4e0db; }

    .folder-item .folder-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .folder-item .folder-name {
      flex: 1;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-item .pin-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 2px 4px;
      color: #900;
      flex-shrink: 0;
    }

    /* ── Hidden ── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="header-title">🐦 AvesO3</span>
    <div class="connection-status" id="connectionStatus">
      <span class="connection-label" id="connectionLabel">Checking…</span>
      <div class="connection-dot" id="connectionDot"></div>
    </div>
  </div>

  <!-- Mode switch -->
  <div class="section">
    <div class="switch-row">
    <span class="switch-label">Folder mode</span>
    <div style="display: flex; align-items: center; gap: 8px;">
        <span class="toggle-state-label" id="toggleStateLabel">OFF</span>
        <label class="toggle">
        <input type="checkbox" id="folderModeToggle">
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
        </label>
    </div>
    </div>
    <p class="mode-message" id="modeMessage">
      Fics will be sent to the root folder of your device.
    </p>
  </div>

  <!-- Folder mode panel -->
  <div id="folderPanel" class="hidden">

    <!-- Saved + Recent -->
    <div class="section">
      <div class="list-section-title">Saved</div>
      <div id="savedList">
        <p class="empty-hint">No saved folders yet. Pin a folder below.</p>
      </div>

      <div style="margin-top: 12px;">
        <div class="list-section-title">Recent</div>
        <div id="recentList">
          <p class="empty-hint">No recent folders yet.</p>
        </div>
      </div>
    </div>

    <!-- Fetch button -->
    <div class="section">
      <button class="fetch-btn" id="fetchBtn">↓ Fetch folder structure</button>
    </div>

    <!-- Folder browser -->
    <div id="folderBrowser" class="hidden">

      <!-- Breadcrumb -->
      <div class="breadcrumb-bar">
        <button class="back-btn" id="backBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <span class="breadcrumb-path" id="breadcrumbPath">root</span>
      </div>

      <!-- Folder list -->
      <ul class="folder-list" id="folderList"></ul>

    </div>

  </div>

</body>
<script src="popup.js"></script>
</html>
